<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>STUDIQ AI — Think Deeper. Learn Faster.</title>
    <meta
      name="description"
      content="STUDIQ AI — Think Deeper. Learn Faster. AI-powered learning and study management platform with concept tutoring, notes summarization, adaptive quizzes, flashcards, study planning, and progress analytics."
    />
    <meta property="og:title" content="STUDIQ AI — Think Deeper. Learn Faster." />
    <meta
      property="og:description"
      content="AI-powered learning and study management platform with concept tutoring, notes summarization, adaptive quizzes, flashcards, study planning, and progress analytics."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('studiq_theme_mode') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-main)] text-[var(--text-main)] antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
